name: Build Hadoop 3.3.6 CentOS 7 RPMs
on:
  workflow_dispatch:
    inputs:
      free_quota_confirmed:
        description: Free quota and no paid overage have been confirmed
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: centos7-hadoop-build
  cancel-in-progress: false
jobs:
  build:
    if: ${{ inputs.free_quota_confirmed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: apache/bigtop
          ref: d44a5845eeffe6bab7037a3ca816cf3c9df44029
          path: upstream/bigtop
          persist-credentials: false
      - name: Compile Hadoop and Bigtop dependencies
        timeout-minutes: 110
        env:
          BUILD_EXTRA: hadoop
        run: bash scripts/build-foundation.sh
      - name: Save RPMs to a private draft release
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/save-hadoop-draft.sh
      - name: Preserve small build records
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hadoop-build-records-${{ github.run_id }}
          path: |
            artifacts/*.log
            artifacts/*.txt
            artifacts/*.json
            artifacts/*.patch
            artifacts/*SHA256SUMS
          retention-days: 1
