name: Install and run the offline Ambari management plane
on: workflow_dispatch
permissions:
  contents: write
jobs:
  management:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          bash cluster/archive-input.sh
          gh release download el7-runtime-44273252473 -p el7-runtime.tar
          sha256sum -c manifests/runtime-44273252473.sha256
          tar xf el7-runtime.tar
          rm el7-runtime.tar
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bash cluster/test-offline-management.sh
      - if: failure()
        run: |
          docker exec server tail -n 30 /var/log/ambari-server/ambari-server.log || true
          docker exec server tail -n 100 /var/log/ambari-server/ambari-server.out || true
          docker logs --tail 25 management-db || true
          docker exec agent tail -n 30 /var/log/ambari-agent/ambari-agent.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-management
          path: management-evidence/
          retention-days: 3
