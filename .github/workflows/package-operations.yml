name: Assemble checked operations bundle
on:
  workflow_dispatch:
    inputs:
      acceptance:
        description: Successful test-cluster workflow run ID
        type: string
        required: true
      runtime:
        description: Offline dependency run ID used in acceptance
        type: string
        required: true
      management:
        description: Successful offline-management verification run ID
        type: string
        required: true
      scale_management:
        description: Successful 20 and 100 agent verification run ID
        type: string
        required: true
env:
  PYTHONDONTWRITEBYTECODE: "1"
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check workflow provenance and retrieve acceptance records
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE: ${{ inputs.acceptance }}
          RUNTIME: ${{ inputs.runtime }}
          MANAGEMENT: ${{ inputs.management }}
          SCALE: ${{ inputs.scale_management }}
        run: |
          [[ "$ACCEPTANCE" =~ ^[0-9]+$ && "$RUNTIME" =~ ^[0-9]+$ && "$MANAGEMENT" =~ ^[0-9]+$ && "$SCALE" =~ ^[0-9]+$ ]]
          mkdir -p kit/evidence
          for item in "$ACCEPTANCE:test-cluster" "$RUNTIME:offline-runtime" "$MANAGEMENT:offline-management" "$SCALE:test-management-installer"; do
            id=${item%:*}; workflow=${item#*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" > "kit/evidence/$workflow.json"
            jq -e --arg path ".github/workflows/$workflow.yml" '.conclusion=="success" and .head_branch=="main" and .path==$path' "kit/evidence/$workflow.json"
          done
          for count in 20 100; do
            gh run download "$SCALE" -n "management-$count" -D "kit/evidence/agents-$count"
            jq -e --argjson n "$count" '(.items|length)==$n and ([.items[].Hosts.host_name]|unique|length)==$n and all(.items[]; .Hosts.host_state=="HEALTHY")' "kit/evidence/agents-$count/hosts.json"
          done
          gh run download "$ACCEPTANCE" -n cluster-evidence -D kit/evidence/cluster
          gh run download "$MANAGEMENT" -n offline-management -D kit/evidence/management
          jq -e '.Hosts.host_state=="HEALTHY"' kit/evidence/management/host.json
          jq -e '.Versions.stack_version=="3.3.0"' kit/evidence/management/stack.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44340595879" > kit/evidence/management/installer-run.json
          jq -e '.conclusion=="success" and .path==".github/workflows/test-management-installer.yml"' kit/evidence/management/installer-run.json
          gh run download 44340595879 -n ten-agent-management -D kit/evidence/management
          jq -e '(.items|length)==10 and all(.items[]; .Hosts.host_state=="HEALTHY")' kit/evidence/management/ten-hosts.json
          grep -Fx "el7-runtime-$RUNTIME" kit/evidence/cluster/runtime-release.txt
          grep '^HDFS_HA_PASSED ' kit/evidence/cluster/failover.log
          grep '^YARN_HA_PASSED ' kit/evidence/cluster/failover.log
          grep '^YARN_WORK_PRESERVING_FAILOVER_PASSED ' kit/evidence/cluster/failover.log
          grep '^HIVE_TEZ_PASSED ' kit/evidence/cluster/compute-run.log
          grep '^SPARK_YARN_PASSED ' kit/evidence/cluster/compute-run.log
          grep '^HIVESERVER2_JDBC_PASSED' kit/evidence/cluster/hs2-run.log
      - run: bash cluster/archive-input.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Assemble volumes and verify every file
        env:
          RUNTIME: ${{ inputs.runtime }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "el7-runtime-$RUNTIME" -p el7-runtime.tar -p runtime.sha256
          sha256sum -c runtime.sha256
          sha256sum -c "manifests/runtime-$RUNTIME.sha256"
          tar xf el7-runtime.tar -C kit
          rm el7-runtime.tar
          mv yum-staging kit/
          cp -a ops kit/
          set -o pipefail
          python3 -m unittest discover -s tests
          bash tests/test_os_preflight.sh | tee kit/evidence/os-preflight.txt
          python3 production/check.py | tee kit/evidence/configurations.txt
          for count in 20 100; do
            python3 ops/generate-inventory.py --nodes "$count" --domain site.example > "$RUNNER_TEMP/hosts-$count.csv"
            bash production/start-cluster.sh --action plan --inventory "$RUNNER_TEMP/hosts-$count.csv" --site production/site.example.json --snapshot "$RUNNER_TEMP/plan-$count" > "kit/evidence/plan-$count.txt"
            jq -e --argjson n "$count" 'length==$n' "$RUNNER_TEMP/plan-$count/plan.json"
          done
          bash production/start-cluster.sh --action plan --inventory ops/hosts.example.csv --site production/site.example.json --snapshot "$RUNNER_TEMP/operator-plan"
          cp -a production kit/
          mkdir -p kit/cluster
          cp cluster/provision-node.sh kit/cluster/
          cp docs/runtime-baseline.md kit/DEPENDENCIES.zh-CN.md
          cp -a docs/evidence/*.json kit/evidence/
          (cd kit && sha256sum -c manifests/runtime-SHA256SUMS >/dev/null)
          git archive "$GITHUB_SHA" -o kit/build-source.tar.gz
          cp kit/ops/README.md kit/INSTALL.zh-CN.md
          (cd kit && find . -type f ! -path ./SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd kit && sha256sum SHA256SUMS) > kit-manifest.sha256
          mkdir delivery
          tar cf - -C kit . | split -b 950M -d -a 2 - delivery/ambari-bigtop-el7.tar.part-
          cd delivery
          sha256sum *.part-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat *.part-* | python3 ../scripts/check-operations-stream.py
      - name: Create draft with packages and operator guide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "el7-operations-$GITHUB_RUN_ID" --target "$GITHUB_SHA" --draft --title "Ambari + Bigtop | CentOS 7.9 x86_64 运维交付包" --notes-file docs/releases/operations.md delivery/* kit-manifest.sha256 kit/INSTALL.zh-CN.md kit/manifests/runtime-versions.tsv kit/manifests/application-rpm-requires.txt
