name: Verify Ambari agent heartbeat and BIGTOP stack
on:
  workflow_dispatch:
    inputs:
      build_run:
        type: string
        required: true
        description: Public Ambari build run with a matching approved checksum manifest
permissions:
  contents: write # Required for downloading draft assets.
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retrieve checked pair of RPMs
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          test -f "manifests/ambari-$BUILD_RUN.sha256"
          gh release download "ambari-3.0.0-c7-run-$BUILD_RUN" -p '*.rpm' -D artifacts/ambari
          (cd artifacts/ambari && sha256sum -c "../../manifests/ambari-$BUILD_RUN.sha256")
          test -f artifacts/ambari/ambari-server-3.0.0.0-2.compat2.el7.x86_64.rpm
          test -f artifacts/ambari/ambari-agent-3.0.0.0-2.compat2.el7.x86_64.rpm
      - run: bash scripts/verify-ambari-registration.sh
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: heartbeat-and-stack-${{ github.run_id }}
          path: artifacts/ambari-*.json
          retention-days: 1
